<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC — Murale</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<main class="layout layout--model">
  <header>
    <p class="label">Wstępna koncepcja</p>
    <h1 class="visually-hidden">Mural</h1>
    <div class="tabs" role="group" aria-label="Pomieszczenie">
      <button type="button" data-sala="1" aria-pressed="true">Sala 1</button>
      <button type="button" data-sala="2" aria-pressed="false">Sala 2</button>
    </div>
    <div class="tabs" id="light-tabs" role="group" aria-label="Oświetlenie" hidden>
      <button type="button" id="light-toggle" aria-label="Oświetlenie LED" aria-pressed="false" title="Włącz LED">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 17v-1.5a6 6 0 1 1 6 0V17M9 17h6M9.5 20h5M11 22h2"/>
          <path class="bulb-rays" d="M12 1v-1M4.2 4.2 2.8 2.8M19.8 4.2l1.4-1.4M2 10H0M22 10h2"/>
        </svg>
      </button>
    </div>
  </header>
  <figure class="stage" id="model">
    <div class="frame" id="viewport" aria-label="Interaktywny model wnętrza">
      <div id="loader" role="progressbar" aria-label="Wczytywanie modelu 3D" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <p class="loader-label">Wczytuję model 3D</p>
        <div class="loader-track"><div class="loader-fill"></div></div>
        <p class="loader-value">0%</p>
      </div>
      <p id="status" role="status"></p>
    </div>
    <figcaption class="model-meta">
      <span class="meta-caption" id="pattern-caption" aria-live="polite">Wzór 1</span>
      <div class="pager" id="pattern-navigation" role="group" aria-label="Przewijanie wzorów" hidden>
        <button type="button" id="previous-pattern" aria-label="Poprzedni wzór" aria-controls="pattern-caption">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <button type="button" id="next-pattern" aria-label="Następny wzór" aria-controls="pattern-caption">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
      <div id="zoom-tools" role="group" aria-label="Powiększenie modelu" hidden>
        <button type="button" id="zoom-out" aria-label="Oddal">−</button>
        <span id="zoom-level">100%</span>
        <button type="button" id="zoom-in" aria-label="Powiększ">+</button>
      </div>
    </figcaption>
  </figure>
  <footer class="credit">© Amitiel Angelisme</footer>
</main>
<script type="module" src="./viewer.js"></script>
</body>
</html>
